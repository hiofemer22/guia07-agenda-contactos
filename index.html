<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agenda de contactos con HTML, CSS, JavaScript, Git y GitHub" />
    <title>Agenda de Contactos</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Encabezado de la página -->
    <header>
      <h1>📒 Agenda de Contactos</h1>
      <p>Registra, consulta y administra tus contactos</p>
    </header>

    <!-- Contenido principal -->
    <main>
      <!-- Sección para registrar un nuevo contacto -->
      <section id="seccion-registro" class="tarjeta">
        <h2>Nuevo contacto</h2>

        <form id="formContacto" novalidate>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: María López" maxlength="50" />

          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="Ej: 987654321" maxlength="15" />

          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="Ej: maria@gmail.com" maxlength="60" />

          <button type="submit">Agregar contacto</button>
        </form>

        <!-- Mensaje de validación o confirmación -->
        <p id="mensaje"></p>
      </section>

      <!-- Sección con la lista de contactos -->
      <section id="seccion-lista" class="tarjeta">
        <h2>Mis contactos</h2>
        <p class="texto-pendiente">Próximamente: lista de contactos.</p>
      </section>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>Desarrollo de Software I - Guía 07 - Ejercicio Propuesto 02</p>
    </footer>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
