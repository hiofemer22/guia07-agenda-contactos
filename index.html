<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agenda de contactos con HTML, CSS, JavaScript, Git y GitHub" />
    <title>Agenda de Contactos</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Encabezado de la página -->
    <header>
      <h1>📒 Agenda de Contactos</h1>
      <p>Registra, consulta y administra tus contactos</p>
    </header>

    <!-- Contenido principal -->
    <main>
      <!-- Sección para registrar un nuevo contacto -->
      <section id="seccion-registro" class="tarjeta">
        <h2>Nuevo contacto</h2>
        <p class="texto-pendiente">Próximamente: formulario de registro.</p>
      </section>

      <!-- Sección con la lista de contactos -->
      <section id="seccion-lista" class="tarjeta">
        <h2>Mis contactos</h2>
        <p class="texto-pendiente">Próximamente: lista de contactos.</p>
      </section>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>Desarrollo de Software I - Guía 07 - Ejercicio Propuesto 02</p>
    </footer>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
